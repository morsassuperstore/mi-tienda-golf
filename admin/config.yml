# Configuración de Decap CMS para Morsa's Proshop
backend:
  name: github
  repo: morsassuperstore/mi-tienda-golf
  branch: main
  # NOTA DE PRODUCCIÓN: Cuando pases la web a producción (morsasgolf.com), 
  # recuerda cambiar la url base a: https://morsasgolf.com
  base_url: https://admin-dev.morsasgolf.com
  auth_endpoint: publicador/api/oauth.php

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "inicio"
    label: "Página de Inicio"
    description: "Edita de forma visual los banners, imágenes, textos, promociones, sucursales y datos de pago de la portada."
    delete: false
    files:
      - name: "home"
        label: "Contenido de la Página de Inicio"
        file: "data/home.json"
        fields:
          - label: "Barra de Anuncio Superior"
            name: "announcement_bar"
            widget: "string"
          - label: "Video de Portada (Opcional - Archivo .mp4)"
            name: "hero_video"
            widget: "file"
            required: false
            default: ""
          - label: "Banners Principales (Carrusel)"
            name: "hero_banners"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "Imagen de Banner (Obligatorio)"
                name: "image_desktop"
                widget: "image"
              - label: "Imagen para Móviles (Opcional, si deseas que se vea mejor en teléfonos)"
                name: "image_mobile"
                widget: "image"
                required: false
                default: ""
              - label: "Enlace (A dónde lleva al hacer clic)"
                name: "link"
                widget: "string"
                required: false
                default: ""
              - label: "Texto Alternativo (Para SEO y ciegos)"
                name: "alt"
                widget: "string"
                required: false
                default: ""
          - label: "Sección Deportes (Conteo e Imágenes)"
            name: "sports"
            widget: "object"
            fields:
              - label: "Texto Golf"
                name: "golf_count"
                widget: "string"
              - label: "Imagen de Portada Golf"
                name: "golf_image"
                widget: "image"
              - label: "Texto Pádel"
                name: "padel_count"
                widget: "string"
              - label: "Imagen de Portada Pádel"
                name: "padel_image"
                widget: "image"
              - label: "Texto Tenis"
                name: "tenis_count"
                widget: "string"
              - label: "Imagen de Portada Tenis"
                name: "tenis_image"
                widget: "image"
          - label: "Sección Simulador"
            name: "simulator"
            widget: "object"
            fields:
              - label: "Cintillo Superior (Eyebrow)"
                name: "eyebrow"
                widget: "string"
              - label: "Título de la Sección (Soporta HTML)"
                name: "title"
                widget: "string"
              - label: "Descripción"
                name: "desc"
                widget: "text"
              - label: "Imagen"
                name: "image"
                widget: "image"
              - label: "Leyenda de Tecnología (GCQuad)"
                name: "tech_badge"
                widget: "string"
              - label: "Texto Botón Principal"
                name: "btn_primary_text"
                widget: "string"
              - label: "Enlace Botón Principal (Ruta o URL)"
                name: "btn_primary_link"
                widget: "string"
          - label: "Sucursales (¿Dónde Estamos?)"
            name: "locations"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "Cintillo (Ej: 📍 Caracas)"
                name: "badge"
                widget: "string"
              - label: "Nombre de la Sucursal"
                name: "name"
                widget: "string"
              - label: "Dirección Corta"
                name: "address"
                widget: "string"
              - label: "URL de Mapa de Google (Iframe Embed src)"
                name: "map_url"
                widget: "string"
              - label: "URL de Google Maps (Para botón 'Cómo llegar')"
                name: "directions_link"
                widget: "string"
              - label: "Horario de Atención"
                name: "hours"
                widget: "string"
                required: false
                default: ""
          - label: "Configuración de Pagos"
            name: "payment"
            widget: "object"
            required: false
            fields:
              - label: "Email de Zelle"
                name: "zelle_email"
                widget: "string"
          - label: "Productos Destacados del Menú"
            name: "menu_featured"
            widget: "object"
            fields:
              - label: "Golf"
                name: "golf"
                widget: "object"
                fields:
                  - label: "Etiqueta (ej: Destacado)"
                    name: "label"
                    widget: "string"
                  - label: "Título del Producto"
                    name: "title"
                    widget: "string"
                  - label: "Imagen"
                    name: "image"
                    widget: "image"
                  - label: "Enlace de Destino"
                    name: "link"
                    widget: "string"
              - label: "Pádel"
                name: "padel"
                widget: "object"
                fields:
                  - label: "Etiqueta (ej: Top ventas)"
                    name: "label"
                    widget: "string"
                  - label: "Título del Producto"
                    name: "title"
                    widget: "string"
                  - label: "Imagen"
                    name: "image"
                    widget: "image"
                  - label: "Enlace de Destino"
                    name: "link"
                    widget: "string"
              - label: "Tenis"
                name: "tenis"
                widget: "object"
                fields:
                  - label: "Etiqueta (ej: Top ventas)"
                    name: "label"
                    widget: "string"
                  - label: "Título del Producto"
                    name: "title"
                    widget: "string"
                  - label: "Imagen"
                    name: "image"
                    widget: "image"
                  - label: "Enlace de Destino"
                    name: "link"
                    widget: "string"
