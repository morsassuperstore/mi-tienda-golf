# Configuración de Decap CMS para Morsa's Proshop
backend:
  name: github
  repo: morsassuperstore/mi-tienda-golf
  branch: main
  # NOTA DE PRODUCCIÓN: Cuando pases la web a producción (morsasgolf.com), 
  # recuerda cambiar la url base a: https://morsasgolf.com
  base_url: https://dev.morsasgolf.com
  auth_endpoint: api/oauth.php

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "navegacion"
    label: "Menú de Navegación"
    description: "Edita el texto del anuncio superior y las pestañas del menú principal (Golf, Pádel, Tenis, etc.)."
    delete: false
    files:
      - name: "menu_main"
        label: "Estructura del Menú Principal"
        file: "data/menu.json"
        editor:
          preview: false
        fields:
          - label: "Texto del Anuncio Superior"
            name: "announcement_text"
            widget: "string"
          - label: "Pestañas del Menú Principal"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Título de la Pestaña (ej. Golf, Pádel)"
                name: "title"
                widget: "string"
              - label: "Enlace Principal (ej. tienda.html?sport=golf)"
                name: "url"
                widget: "string"
              - label: "Tipo de Menú"
                name: "type"
                widget: "select"
                options:
                  - label: "Mega Menú (Columnas + Producto Destacado)"
                    value: "mega"
                  - label: "Desplegable Simple"
                    value: "simple"
              - label: "Título de Sección (Solo para Desplegable Simple)"
                name: "section_title"
                widget: "string"
                required: false
              - label: "Columnas del Mega Menú"
                name: "columns"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - label: "Título de la Columna"
                    name: "title"
                    widget: "string"
                    required: false
                  - label: "Enlaces de la Columna"
                    name: "links"
                    widget: "list"
                    required: false
                    summary: "{{fields.text}}"
                    fields:
                      - label: "Texto del Enlace"
                        name: "text"
                        widget: "string"
                        required: false
                      - label: "Ruta / URL del Enlace"
                        name: "url"
                        widget: "string"
                        required: false
              - label: "Producto Destacado (Mega Menú)"
                name: "featured"
                widget: "object"
                required: false
                fields:
                  - label: "Imagen"
                    name: "image"
                    widget: "image"
                    required: false
                  - label: "Etiqueta (ej. Destacado, Top Ventas)"
                    name: "label"
                    widget: "string"
                    required: false
                  - label: "Título del Producto"
                    name: "title"
                    widget: "string"
                    required: false
                  - label: "Enlace de Destino"
                    name: "url"
                    widget: "string"
                    required: false
              - label: "Enlaces Simples (Solo para Desplegable Simple)"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.text}}"
                fields:
                  - label: "Texto del Enlace"
                    name: "text"
                    widget: "string"
                    required: false
                  - label: "Ruta / URL del Enlace"
                    name: "url"
                    widget: "string"
                    required: false

  - name: "inicio"
    label: "Página de Inicio"
    description: "Edita de forma visual los banners, imágenes, textos, promociones, sucursales y datos de pago de la portada."
    delete: false
    files:
      - name: "home"
        label: "Contenido de la Página de Inicio"
        file: "data/home.json"
        editor:
          preview: false
        fields:
          - label: "Banners Principales (Carrusel)"
            name: "hero_banners"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "Imagen de Banner (Obligatorio)"
                name: "image_desktop"
                widget: "image"
              - label: "Imagen para Móviles (Opcional, si deseas que se vea mejor en teléfonos)"
                name: "image_mobile"
                widget: "image"
                required: false
                default: ""
              - label: "Enlace (A dónde lleva al hacer clic)"
                name: "link"
                widget: "string"
                required: false
                default: ""
              - label: "Texto Alternativo (Para SEO y ciegos)"
                name: "alt"
                widget: "string"
                required: false
                default: ""
              - label: "Cintillo del Banner (Opcional - Eyebrow)"
                name: "eyebrow"
                widget: "string"
                required: false
                default: ""
              - label: "Título Principal (Opcional - Soporta HTML como <br>)"
                name: "title"
                widget: "string"
                required: false
                default: ""
              - label: "Subtítulo / Descripción (Opcional)"
                name: "subtitle"
                widget: "string"
                required: false
                default: ""
              - label: "Texto de Botón Principal (Opcional)"
                name: "btn_primary_text"
                widget: "string"
                required: false
                default: ""
              - label: "Enlace de Botón Principal (Opcional)"
                name: "btn_primary_link"
                widget: "string"
                required: false
                default: ""
              - label: "Texto de Botón Secundario (Opcional)"
                name: "btn_secondary_text"
                widget: "string"
                required: false
                default: ""
              - label: "Enlace de Botón Secundario (Opcional)"
                name: "btn_secondary_link"
                widget: "string"
                required: false
                default: ""
          - label: "Sección Deportes (Conteo e Imágenes)"
            name: "sports"
            widget: "object"
            fields:
              - label: "Texto Golf"
                name: "golf_count"
                widget: "string"
              - label: "Imagen de Portada Golf"
                name: "golf_image"
                widget: "image"
              - label: "Texto Pádel"
                name: "padel_count"
                widget: "string"
              - label: "Imagen de Portada Pádel"
                name: "padel_image"
                widget: "image"
              - label: "Texto Tenis"
                name: "tenis_count"
                widget: "string"
              - label: "Imagen de Portada Tenis"
                name: "tenis_image"
                widget: "image"
          - label: "Sección Colecciones por Género"
            name: "gender_collections"
            widget: "object"
            fields:
              - label: "Imagen de Portada Caballeros"
                name: "men_image"
                widget: "image"
              - label: "Imagen de Portada Damas"
                name: "women_image"
                widget: "image"
          - label: "Sección Simulador"
            name: "simulator"
            widget: "object"
            fields:
              - label: "Cintillo Superior (Eyebrow)"
                name: "eyebrow"
                widget: "string"
              - label: "Título de la Sección (Soporta HTML)"
                name: "title"
                widget: "string"
              - label: "Descripción"
                name: "desc"
                widget: "text"
              - label: "Imagen"
                name: "image"
                widget: "image"
              - label: "Leyenda de Tecnología (GCQuad)"
                name: "tech_badge"
                widget: "string"
              - label: "Texto Botón Principal"
                name: "btn_primary_text"
                widget: "string"
              - label: "Enlace Botón Principal (Ruta o URL)"
                name: "btn_primary_link"
                widget: "string"
          - label: "Sucursales (¿Dónde Estamos?)"
            name: "locations"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "Cintillo (Ej: 📍 Caracas)"
                name: "badge"
                widget: "string"
              - label: "Nombre de la Sucursal"
                name: "name"
                widget: "string"
              - label: "Dirección Corta"
                name: "address"
                widget: "string"
              - label: "URL de Mapa de Google (Iframe Embed src)"
                name: "map_url"
                widget: "string"
              - label: "URL de Google Maps (Para botón 'Cómo llegar')"
                name: "directions_link"
                widget: "string"
              - label: "Horario de Atención"
                name: "hours"
                widget: "string"
                required: false
                default: ""
          - label: "Productos Destacados del Menú"
            name: "menu_featured"
            widget: "object"
            fields:
              - label: "Golf"
                name: "golf"
                widget: "object"
                fields:
                  - label: "Etiqueta (ej: Destacado)"
                    name: "label"
                    widget: "string"
                  - label: "Título del Producto"
                    name: "title"
                    widget: "string"
                  - label: "Imagen"
                    name: "image"
                    widget: "image"
                  - label: "Enlace de Destino"
                    name: "link"
                    widget: "string"
              - label: "Pádel"
                name: "padel"
                widget: "object"
                fields:
                  - label: "Etiqueta (ej: Top ventas)"
                    name: "label"
                    widget: "string"
                  - label: "Título del Producto"
                    name: "title"
                    widget: "string"
                  - label: "Imagen"
                    name: "image"
                    widget: "image"
                  - label: "Enlace de Destino"
                    name: "link"
                    widget: "string"
              - label: "Tenis"
                name: "tenis"
                widget: "object"
                fields:
                  - label: "Etiqueta (ej: Top ventas)"
                    name: "label"
                    widget: "string"
                  - label: "Título del Producto"
                    name: "title"
                    widget: "string"
                  - label: "Imagen"
                    name: "image"
                    widget: "image"
                  - label: "Enlace de Destino"
                    name: "link"
                    widget: "string"
          - label: "Logotipos de Marcas (Loop)"
            name: "brands"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "Nombre de la Marca"
                name: "name"
                widget: "string"
              - label: "Logotipo de la Marca"
                name: "logo"
                widget: "image"

  - name: "nosotros"
    label: "Nosotros"
    description: "Edita el contenido de la página Sobre Nosotros (Historia, imágenes, valores)."
    delete: false
    files:
      - name: "nosotros_page"
        label: "Contenido de Nosotros"
        file: "data/nosotros.json"
        editor:
          preview: false
        fields:
          - label: "Cintillo (Ej: Sobre Nosotros)"
            name: "eyebrow"
            widget: "string"
          - label: "Título Principal"
            name: "title"
            widget: "string"
          - label: "Subtítulo"
            name: "subtitle"
            widget: "string"
          - label: "Historia y Párrafos"
            name: "history_text"
            widget: "list"
            fields:
              - label: "Párrafo (Puedes usar etiquetas HTML fuertes como <strong>)"
                name: "paragraph"
                widget: "text"
          - label: "Imagen Destacada"
            name: "main_image"
            widget: "image"
          - label: "Insignia de la Imagen (Valor)"
            name: "badge_value"
            widget: "string"
          - label: "Insignia de la Imagen (Etiqueta)"
            name: "badge_label"
            widget: "string"

  - name: "guia_tallas"
    label: "Guía de Tallas"
    description: "Edita el contenido y textos de la página Guía de Tallas."
    delete: false
    files:
      - name: "tallas_page"
        label: "Contenido de Guía de Tallas"
        file: "data/guia-tallas.json"
        editor:
          preview: false
        fields:
          - label: "Cintillo superior (Eyebrow)"
            name: "eyebrow"
            widget: "string"
          - label: "Título Principal"
            name: "title"
            widget: "string"
          - label: "Subtítulo"
            name: "subtitle"
            widget: "text"
          - label: "Título de CTA (Dudas con tu talla)"
            name: "cta_title"
            widget: "string"
          - label: "Descripción de CTA"
            name: "cta_desc"
            widget: "text"
          - label: "Texto del Botón WhatsApp"
            name: "cta_btn_text"
            widget: "string"
          - label: "Enlace del Botón WhatsApp"
            name: "cta_btn_link"
            widget: "string"

  - name: "envios"
    label: "Política de Envíos"
    description: "Edita el contenido de la página Política de Envíos y Entregas."
    delete: false
    files:
      - name: "envios_page"
        label: "Contenido de Envíos"
        file: "data/envios.json"
        editor:
          preview: false
        fields:
          - label: "Cintillo superior (Eyebrow)"
            name: "eyebrow"
            widget: "string"
          - label: "Título Principal"
            name: "title"
            widget: "string"
          - label: "Subtítulo"
            name: "subtitle"
            widget: "text"
          - label: "Tarjetas de Política (Envíos, Tiempos, etc.)"
            name: "policy_cards"
            widget: "list"
            fields:
              - label: "Título de la tarjeta"
                name: "title"
                widget: "string"
              - label: "Descripción principal"
                name: "text"
                widget: "text"
              - label: "Viñetas / Puntos clave (HTML permitido)"
                name: "bullets"
                widget: "list"
          - label: "Título Embalaje Especializado"
            name: "packaging_title"
            widget: "string"
          - label: "Texto Embalaje Especializado"
            name: "packaging_text"
            widget: "text"
          - label: "Título de CTA"
            name: "cta_title"
            widget: "string"
          - label: "Descripción de CTA"
            name: "cta_desc"
            widget: "text"
          - label: "Texto del Botón WhatsApp"
            name: "cta_btn_text"
            widget: "string"
          - label: "Enlace del Botón WhatsApp"
            name: "cta_btn_link"
            widget: "string"

  - name: "devoluciones"
    label: "Devoluciones y Garantías"
    description: "Edita el contenido de la página Cambios, Garantías y Devoluciones."
    delete: false
    files:
      - name: "devoluciones_page"
        label: "Contenido de Devoluciones"
        file: "data/devoluciones.json"
        editor:
          preview: false
        fields:
          - label: "Cintillo superior (Eyebrow)"
            name: "eyebrow"
            widget: "string"
          - label: "Título Principal"
            name: "title"
            widget: "string"
          - label: "Subtítulo"
            name: "subtitle"
            widget: "text"
          - label: "Título Sección Pasos"
            name: "steps_title"
            widget: "string"
          - label: "Pasos para solicitar cambio"
            name: "steps"
            widget: "list"
            fields:
              - label: "Número (ej: 01)"
                name: "number"
                widget: "string"
              - label: "Título del paso"
                name: "title"
                widget: "string"
              - label: "Descripción del paso"
                name: "text"
                widget: "text"
          - label: "Tarjetas de Condiciones y Garantías"
            name: "policy_cards"
            widget: "list"
            fields:
              - label: "Título de la tarjeta"
                name: "title"
                widget: "string"
              - label: "Descripción principal"
                name: "text"
                widget: "text"
              - label: "Viñetas / Condiciones (HTML permitido)"
                name: "bullets"
                widget: "list"
          - label: "Título de CTA"
            name: "cta_title"
            widget: "string"
          - label: "Descripción de CTA"
            name: "cta_desc"
            widget: "text"
          - label: "Texto del Botón WhatsApp"
            name: "cta_btn_text"
            widget: "string"
          - label: "Enlace del Botón WhatsApp"
            name: "cta_btn_link"
            widget: "string"

  - name: "configuracion"
    label: "Configuración de Tienda"
    description: "Parámetros globales, instrucciones de pago y redes sociales."
    delete: false
    files:
      - name: "store_config"
        label: "Datos de Tienda y Pagos"
        file: "data/store_config.json"
        editor:
          preview: false
        fields:
          - label: "Número de WhatsApp (Sin +, con código de país. Ej: 584128422837)"
            name: "whatsapp_number"
            widget: "string"
          - label: "Monto Mínimo para Envío Gratis (Ref.)"
            name: "free_shipping_threshold"
            widget: "number"
            value_type: "int"
            default: 100
          - label: "Costo de Envío (Delivery)"
            name: "delivery_cost"
            widget: "number"
            value_type: "int"
            default: 3
          - label: "Tasa de Cambio Manual (Opcional, dejar vacío o 0 si el cajero lo ingresará)"
            name: "manual_exchange_rate"
            widget: "number"
            value_type: "float"
            required: false
          - label: "Datos de Pago - Zelle"
            name: "payment_zelle"
            widget: "object"
            fields:
              - label: "Correo Zelle"
                name: "email"
                widget: "string"
              - label: "Nombre del Titular"
                name: "name"
                widget: "string"
          - label: "Datos de Pago - Venmo"
            name: "payment_venmo"
            widget: "object"
            fields:
              - label: "Usuario Venmo"
                name: "user"
                widget: "string"
              - label: "Nombre del Titular"
                name: "name"
                widget: "string"
          - label: "Datos de Pago Móvil"
            name: "payment_pagomovil"
            widget: "object"
            fields:
              - label: "Banco"
                name: "bank"
                widget: "string"
              - label: "Cédula o RIF"
                name: "id"
                widget: "string"
              - label: "Teléfono"
                name: "phone"
                widget: "string"
          - label: "Datos de Binance / USDT"
            name: "payment_binance"
            widget: "object"
            fields:
              - label: "Binance Pay ID / Correo"
                name: "pay_id"
                widget: "string"
          - label: "Redes Sociales"
            name: "social_links"
            widget: "object"
            fields:
              - label: "Enlace Instagram"
                name: "instagram"
                widget: "string"
                required: false
              - label: "Enlace Facebook"
                name: "facebook"
                widget: "string"
                required: false
              - label: "Enlace Twitter / X"
                name: "twitter"
                widget: "string"
                required: false
