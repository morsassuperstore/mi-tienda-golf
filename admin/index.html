<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morsa's Proshop - Administrador Visual</title>
  <!-- Forzar la recarga del archivo config.yml evitando caché -->
  <link href="config.yml?v=2" type="text/yaml" rel="cms-config-url" />
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
  <style>
    /* Personalización visual opcional del panel para alinearlo al estilo de Morsas */
    #nc-root .nc-app-layout-logo {
      font-family: 'Bebas Neue', sans-serif !important;
      font-size: 22px !important;
      letter-spacing: 0.05em !important;
      color: #F5A623 !important;
    }
  </style>
</head>
<body>
  <!-- Escuchador de depuración para rastrear la comunicación del login -->
  <script>
    window.addEventListener('message', (event) => {
      console.log('--- DEPURACIÓN OAUTH ---');
      console.log('Origen recibido:', event.origin);
      console.log('Datos recibidos:', event.data);
      
      // FORZAR EL LOGIN: Si Decap CMS falla al interceptar el mensaje (por problemas de dominios cruzados o timeouts),
      // nosotros capturamos el token manualmente, lo guardamos en el localStorage y recargamos la página.
      if (typeof event.data === 'string' && event.data.startsWith('authorization:github:success:')) {
        try {
          const jsonStr = event.data.replace('authorization:github:success:', '');
          const data = JSON.parse(jsonStr);
          
          if (data.token) {
            console.log("Token capturado manualmente. Guardando sesión y recargando...");
            const userObj = {
              token: data.token,
              backend: "github"
            };
            
            // Guardar en las dos claves por compatibilidad con versiones antiguas y nuevas
            window.localStorage.setItem('decap-cms-user', JSON.stringify(userObj));
            window.localStorage.setItem('netlify-cms-user', JSON.stringify(userObj));
            
            // Forzar recarga para que Decap CMS inicie sesión con el token guardado
            window.location.reload();
          }
        } catch (e) {
          console.error("Error forzando el login manual:", e);
        }
      }
    }, false);

    // FALLBACK 2: Capturar token desde la URL (por si la ventana emergente redirigió en vez de postMessage)
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get('token');
    if (urlToken) {
      console.log("Token encontrado en la URL. Guardando sesión y limpiando URL...");
      const userObj = {
        token: urlToken,
        backend: "github"
      };
      window.localStorage.setItem('decap-cms-user', JSON.stringify(userObj));
      window.localStorage.setItem('netlify-cms-user', JSON.stringify(userObj));
      
      // Limpiar la URL y recargar
      window.history.replaceState({}, document.title, window.location.pathname);
      window.location.reload();
    }
  </script>

  <!-- Cargar Decap CMS desde CDN -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
