<html lang="es">
<head>

  <title>Morsa's Proshop - Administrador Visual</title>

  <style>
    /* Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Bebas+Neue&display=swap');

    /* Variables de marca */
    :root {
      --navy: #0e1a60;
      --navy-dark: #0a0c3c;
      --gold: #F5A623;
      --gold-hover: #D48C12;
      --bg: #f5f7fb;
      --white: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    /* Fuente global */
    body, #nc-root {
      font-family: 'Barlow', sans-serif !important;
    }

    /* --- CABECERA (Header) --- */
    #nc-root header {
      background-color: var(--navy-dark) !important;
      border-bottom: 2px solid var(--gold) !important;
      box-shadow: 0 4px 12px rgba(10, 12, 60, 0.1) !important;
    }

    /* Logo de Morsa's Proshop */
    #nc-root .nc-app-layout-logo {
      font-family: 'Bebas Neue', sans-serif !important;
      font-size: 26px !important;
      letter-spacing: 0.08em !important;
      color: var(--gold) !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }

    /* Texto de links en la cabecera */
    #nc-root header a, 
    #nc-root header button {
      color: rgba(255, 255, 255, 0.8) !important;
      font-weight: 500 !important;
      transition: color 0.2s, background-color 0.2s !important;
    }

    #nc-root header a:hover, 
    #nc-root header button:hover {
      color: var(--gold) !important;
    }

    /* --- MENÚ LATERAL (Sidebar) --- */
    #nc-root aside {
      background-color: var(--white) !important;
      border-right: 1px solid var(--border) !important;
      padding-top: 20px !important;
    }

    /* Enlaces del Sidebar */
    #nc-root aside a {
      display: block !important;
      font-family: 'Barlow Condensed', sans-serif !important;
      font-size: 15px !important;
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      text-transform: uppercase !important;
      border-radius: 8px !important;
      margin: 4px 12px !important;
      padding: 10px 16px !important;
      color: #64748b !important;
      transition: all 0.2s ease !important;
    }

    /* Estado activo del Sidebar */
    #nc-root aside a[class*="active"],
    #nc-root aside a:hover {
      background-color: rgba(14, 26, 96, 0.06) !important;
      color: var(--navy) !important;
      border-left: 4px solid var(--gold) !important;
    }

    /* Estilo para los títulos */
    #nc-root h1, #nc-root h2 {
      font-family: 'Barlow Condensed', sans-serif !important;
      color: var(--navy-dark) !important;
      font-weight: 700 !important;
      letter-spacing: 0.02em !important;
    }

    /* Estilos para las tarjetas de entradas (Listado de CMS) */
    #nc-root [class*="AppMainContainer"] a[class*="Card"] {
      border-radius: 12px !important;
      border: 1px solid var(--border) !important;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04) !important;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s !important;
      background: var(--white) !important;
    }
    #nc-root [class*="AppMainContainer"] a[class*="Card"]:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 15px rgba(0,0,0,0.08) !important;
      border-color: var(--gold) !important;
    }
    
    /* Botones primarios del panel */
    #nc-root button[class*="Button-button-default-primary"] {
      background-color: var(--navy) !important;
      color: var(--white) !important;
      border-radius: 8px !important;
      font-family: 'Barlow Condensed', sans-serif !important;
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
    }
    #nc-root button[class*="Button-button-default-primary"]:hover {
      background-color: var(--gold) !important;
      color: var(--navy-dark) !important;
    }

    /* --- PÁGINA DE LOGIN (Login Screen) --- */
    #nc-root section[class*="Login"] {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%) !important;
      position: relative !important;
    }

    #nc-root section[class*="Login"]::before {
      content: "" !important;
      position: absolute !important;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle at 80% 20%, rgba(245, 166, 35, 0.15) 0%, transparent 50%) !important;
      pointer-events: none !important;
    }

    /* Caja de Login */
    #nc-root section[class*="Login"] > div {
      background-color: var(--white) !important;
      border-radius: 20px !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2) !important;
      border: 1.5px solid rgba(245, 166, 35, 0.2) !important;
      padding: 40px !important;
      width: 100% !important;
      max-width: 420px !important;
    }

    /* Título de Login */
    #nc-root section[class*="Login"] h1 {
      font-family: 'Bebas Neue', sans-serif !important;
      color: var(--navy-dark) !important;
      font-size: 36px !important;
      letter-spacing: 0.05em !important;
      text-align: center !important;
      margin-bottom: 24px !important;
      text-transform: uppercase !important;
    }

    #nc-root section[class*="Login"] h1::after {
      content: " PROSHOP" !important;
      color: var(--gold) !important;
    }

    /* Botón de Autenticación GitHub */
    #nc-root button[class*="LoginButton"] {
      background-color: var(--navy) !important;
      color: var(--white) !important;
      font-family: 'Barlow Condensed', sans-serif !important;
      font-weight: 700 !important;
      font-size: 16px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
      border-radius: 10px !important;
      padding: 14px 20px !important;
      border: 2px solid transparent !important;
      transition: all 0.2s ease !important;
      box-shadow: 0 4px 6px rgba(14, 26, 96, 0.2) !important;
    }

    #nc-root button[class*="LoginButton"]:hover {
      background-color: var(--gold) !important;
      color: var(--navy-dark) !important;
      box-shadow: 0 6px 12px rgba(245, 166, 35, 0.3) !important;
    }

    /* Ocultar la columna derecha de vista previa sin romper React */
    div[class*="PreviewPaneFrameContainer"],
    div[class*="PreviewPaneFrame"],
    div[class*="Pane2"],
    iframe[class*="PreviewFrame"] {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Expandir la columna del formulario de edición al 100% del ancho */
    div[class*="Pane1"],
    div[class*="EditorControlPaneContainer"],
    div[class*="ControlPaneContainer"] {
      width: 100% !important;
      max-width: 100% !important;
      flex: 1 1 100% !important;
    }

    div[class*="PaneContainer"] {
      display: block !important;
    }
  </style>
</head>
<body>
  <script>
    // POLYFILL INMUNE A SEGURIDAD (SERVER-BRIDGE):
    // Dado que navegadores modernos y Edge en modo privado bloquean localStorage y postMessage
    // entre pestañas tras redirecciones, usamos el propio servidor como puente temporal.
    let authWindowRef = null;
    let pollInterval = null;
    const originalOpen = window.open;

    window.open = function(url, target, features) {
        // Generar un ID único para esta sesión de login
        const authId = Math.random().toString(36).substring(2, 15);
        
        // Agregar el state a la url
        const separator = url.indexOf('?') !== -1 ? '&' : '?';
        const newUrl = url + separator + 'state=' + authId;
        
        authWindowRef = originalOpen.call(window, newUrl, target, features);
        
        // Simular el apretón de manos inicial (Handshake) que Decap CMS espera.
        // Decap CMS escucha 'authorizing:github' primero antes de habilitar el recibidor del token.
        setTimeout(() => {
            if (authWindowRef) {
                const handshakeEvent = new MessageEvent('message', {
                    data: 'authorizing:github',
                    origin: window.location.origin
                });
                Object.defineProperty(handshakeEvent, 'source', {
                    get: () => authWindowRef,
                    configurable: true,
                    enumerable: true
                });
                window.dispatchEvent(handshakeEvent);
                console.log("¡Handshake 'authorizing:github' enviado a Decap CMS!");
            }
        }, 500);
        
        // Comenzar a consultar al servidor si el token ya llegó
        startPolling(authId);
        
        return authWindowRef;
    };

    function startPolling(authId) {
        if (pollInterval) clearInterval(pollInterval);
        
        pollInterval = setInterval(() => {
            // Si el usuario cierra la ventanita manualmente, detenemos el sondeo
            if (authWindowRef && authWindowRef.closed) {
                clearInterval(pollInterval);
            }
            
            fetch(`https://dev.morsasgolf.com/api/check_auth.php?state=${authId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.token) {
                        clearInterval(pollInterval);
                        console.log("¡Token obtenido desde el servidor!");
                        
                        const message = 'authorization:github:success:' + JSON.stringify({
                            token: data.token,
                            provider: 'github'
                        });
                        
                        if (authWindowRef) {
                            // Simular el evento 'message' nativo que Decap CMS espera
                            const fakeEvent = new MessageEvent('message', {
                                data: message,
                                origin: window.location.origin
                            });
                            
                            // Hack definitivo: Forzar el getter de 'source' (que los navegadores protegen/anulan)
                            // para que devuelva la referencia original del popup de login.
                            Object.defineProperty(fakeEvent, 'source', {
                                get: () => authWindowRef,
                                configurable: true,
                                enumerable: true
                            });
                            
                            console.log("Despachando evento fake...", {
                                data: fakeEvent.data,
                                origin: fakeEvent.origin,
                                source: fakeEvent.source,
                                originalRef: authWindowRef,
                                matches: fakeEvent.source === authWindowRef
                            });
                            
                            window.dispatchEvent(fakeEvent);
                            
                            // Cerrar el popup de forma segura
                            try {
                                authWindowRef.close();
                            } catch(e) {}
                        }
                    }
                })
                .catch(err => console.error("Error en sondeo de sesión:", err));
        }, 1500);
    }

    // Escuchador de depuración para ver si el evento fake llega y qué campos tiene
    window.addEventListener('message', (e) => {
        console.log("Mensaje detectado en ventana principal:", {
            data: e.data,
            origin: e.origin,
            source: e.source,
            authWindowRef: authWindowRef,
            comparacion: e.source === authWindowRef
        });
    }, true); // Usar fase de captura
  </script>
